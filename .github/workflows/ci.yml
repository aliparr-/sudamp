# Dormant until the repository has a GitHub remote (DESIGN §9 "CI and the macOS 15 floor").
name: ci
on:
  push:
  pull_request:
jobs:
  macos-15:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The runner defaults to Xcode 16.4 (Swift 6.1); Package.swift needs Swift 6.2. Xcode 26.3 = Swift 6.2.4, the
      # oldest supported compiler, so CI catches code that only newer compilers accept.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Toolchain
        run: swift --version && xcrun --show-sdk-version
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/sudamp-dev
          key: spm-${{ runner.os }}-xcode26.3-${{ hashFiles('Package.resolved') }}
      - name: Build and test
        run: make build test
      - name: Third-party notices
        run: scripts/check-notices.sh
