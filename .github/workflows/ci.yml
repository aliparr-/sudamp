# DESIGN §9 "CI and the macOS 15 floor".
name: ci
on:
  push:
  pull_request:
jobs:
  macos-15:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Swift in .swift-version, as on the dev machines (DESIGN §9): its swift.org toolchain, which the Makefile
      # finds in /Library/Developer/Toolchains. Xcode 26.3 supplies the macOS 26 SDK (the runner defaults to Xcode 16.4).
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Install Swift
        run: |
          v=$(tr -d '[:space:]' < .swift-version)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/swift.pkg" \
            "https://download.swift.org/swift-$v-release/xcode/swift-$v-RELEASE/swift-$v-RELEASE-osx.pkg"
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
      - name: Toolchain
        run: make toolchain
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/sudamp-dev
          key: spm-${{ runner.os }}-swift-${{ hashFiles('.swift-version') }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: make build
      # One test at a time: in parallel, the 3-core runner starved tests that wait on timers (a 20 s JSON decode).
      - name: Test
        run: set -o pipefail; make test TEST_MODE=--no-parallel 2>&1 | tee .build/test.log
      - name: Third-party notices
        run: scripts/check-notices.sh
      # Job logs need a GitHub login; annotations are public. Surface errors, warnings and failing tests there.
      - name: Report failures
        if: failure()
        run: |
          for log in .build/build-debug.log .build/test.log; do
            [ -f "$log" ] || continue
            lines=$(grep -E 'error:|warning:|✘|fatal|Fatal|crashed|signal' "$log" | grep -v -E '^ *[|:`]' | grep -v 'search path' | head -60)
            [ -n "$lines" ] || continue
            msg=$(printf '%s' "$lines" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename "$log")::$msg"
          done
